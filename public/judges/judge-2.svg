<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0D1518"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>
      <radialGradient id="glow1" cx="50%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
      </radialGradient>
    </defs>
    
    <rect width="600" height="600" rx="32" fill="url(#grad1)"/>
    <rect width="600" height="600" rx="32" fill="url(#glow1)"/>
    <rect x="2" y="2" width="596" height="596" rx="30" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="3"/>
    
    <!-- Top badge -->
    <rect x="48" y="48" width="240" height="34" rx="17" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
    <text x="168" y="70" fill="#10B981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">JETSON PLATFORMS</text>
    
    <!-- Central Avatar Circle -->
    <circle cx="300" cy="235" r="95" fill="#1e1e24" stroke="#10B981" stroke-width="4" stroke-opacity="0.6"/>
    <text x="300" y="262" fill="#ffffff" font-family="sans-serif" font-size="64" font-weight="600" text-anchor="middle" opacity="0.9">AV</text>
    
    <!-- Name & Role Info -->
    <text x="300" y="390" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="-0.5">Arun Venkat</text>
    <text x="300" y="430" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="20" text-anchor="middle">Sr. Hardware Engineer</text>
    <text x="300" y="468" fill="#10B981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">NVIDIA India</text>

    <!-- Bottom footer pill -->
    <text x="300" y="535" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="3">TECHNICAL JURY · YUVA 2026</text>
  </svg>